<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AssetGuard Evaluation Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f7f8fa; color: #1f2937; }
      h1 { margin-bottom: 8px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.08); min-width: 210px; }
      .card .label { font-size: 13px; color: #6b7280; }
      .card .value { font-size: 24px; font-weight: 700; margin-top: 8px; }
      .panel { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.08); margin-bottom: 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
      input, button { padding: 8px 10px; border-radius: 6px; border: 1px solid #d1d5db; }
      button { background: #111827; color: white; border: none; cursor: pointer; }
      .status-ok { color: #047857; font-weight: 600; }
      .status-bad { color: #b91c1c; font-weight: 600; }
      #message { margin-top: 8px; color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Evaluation Dashboard</h1>
    <p>Login first, then load history statistics and recent evaluation logs.</p>

    <div class="panel">
      <h3>1) Login</h3>
      <div class="row">
        <input id="email" type="email" placeholder="admin@demo.com" />
        <input id="password" type="password" placeholder="password" />
        <button id="loginBtn">Login</button>
      </div>
      <div id="message"></div>
    </div>

    <div class="panel">
      <h3>2) Dashboard summary</h3>
      <div class="row" id="summaryCards"></div>
    </div>

    <div class="panel">
      <h3>Equipment Stats</h3>
      <table>
        <thead><tr><th>Equipment</th><th>Evaluations</th></tr></thead>
        <tbody id="equipmentRows"></tbody>
      </table>
    </div>

    <div class="panel">
      <h3>Top Assets</h3>
      <table>
        <thead><tr><th>Asset</th><th>Evaluations</th></tr></thead>
        <tbody id="assetRows"></tbody>
      </table>
    </div>

    <div class="panel">
      <h3>Recent Evaluations</h3>
      <table>
        <thead>
          <tr>
            <th>Time</th><th>Asset</th><th>Equipment</th><th>Value</th><th>Status</th><th>Overload %</th>
          </tr>
        </thead>
        <tbody id="historyRows"></tbody>
      </table>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
  </body>
</html>
