<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="mf-title">
  <title id="mf-title">Asset Manager workflow</title>
  <defs>
    <linearGradient id="mf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <filter id="mf-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="mf-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1ed760"/>
    </marker>
  </defs>
  <rect width="960" height="200" fill="url(#mf-bg)" rx="12"/>
  <text x="480" y="36" text-anchor="middle" fill="#1ed760" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">ASSET MANAGER</text>
  <text x="480" y="58" text-anchor="middle" fill="#b3b3b3" font-family="Segoe UI, Arial, sans-serif" font-size="12">Oversight, assets, evaluations, and alerts</text>

  <g filter="url(#mf-shadow)"><rect x="20" y="88" width="100" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="70" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Sign in</text></g>
  <line x1="120" y1="112" x2="142" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <g filter="url(#mf-shadow)"><rect x="144" y="88" width="118" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="203" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Dashboard</text></g>
  <line x1="262" y1="112" x2="284" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <g filter="url(#mf-shadow)"><rect x="286" y="88" width="118" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="345" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Assets</text></g>
  <line x1="404" y1="112" x2="426" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <g filter="url(#mf-shadow)"><rect x="428" y="88" width="118" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="487" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Evaluation</text></g>
  <line x1="546" y1="112" x2="568" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <g filter="url(#mf-shadow)"><rect x="570" y="88" width="108" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="624" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">History</text></g>
  <line x1="678" y1="112" x2="700" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <g filter="url(#mf-shadow)"><rect x="702" y="88" width="108" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="756" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Alerts</text></g>
  <line x1="810" y1="112" x2="832" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#mf-arrow)"/>
  <g filter="url(#mf-shadow)"><rect x="834" y="88" width="108" height="48" rx="24" fill="#1f1f1f" stroke="#4d4d4d" stroke-width="1"/><text x="888" y="112" text-anchor="middle" fill="#b3b3b3" font-family="Segoe UI, Arial" font-size="10">Email prefs</text><text x="888" y="126" text-anchor="middle" fill="#b3b3b3" font-family="Segoe UI, Arial" font-size="10">&amp; templates</text></g>

  <text x="345" y="168" text-anchor="middle" fill="#7c7c7c" font-family="Segoe UI, Arial" font-size="10">Create / edit assets</text>
  <text x="624" y="168" text-anchor="middle" fill="#7c7c7c" font-family="Segoe UI, Arial" font-size="10">All team evaluations</text>
</svg>
