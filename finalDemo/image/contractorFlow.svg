<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="cf-title">
  <title id="cf-title">Contractors workflow</title>
  <defs>
    <linearGradient id="cf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <filter id="cf-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="cf-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1ed760"/>
    </marker>
  </defs>
  <rect width="960" height="200" fill="url(#cf-bg)" rx="12"/>
  <text x="480" y="36" text-anchor="middle" fill="#1ed760" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CONTRACTORS</text>
  <text x="480" y="58" text-anchor="middle" fill="#b3b3b3" font-family="Segoe UI, Arial, sans-serif" font-size="12">On-site load checks and own evaluation history</text>

  <g filter="url(#cf-shadow)"><rect x="24" y="88" width="100" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="74" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Sign in</text></g>
  <line x1="124" y1="112" x2="148" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#cf-arrow)"/>
  <g filter="url(#cf-shadow)"><rect x="150" y="88" width="120" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="210" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Select asset</text></g>
  <line x1="270" y1="112" x2="294" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#cf-arrow)"/>
  <g filter="url(#cf-shadow)"><rect x="296" y="88" width="130" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="361" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Evaluate load</text></g>
  <line x1="426" y1="112" x2="450" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#cf-arrow)"/>
  <g filter="url(#cf-shadow)"><rect x="452" y="88" width="100" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="502" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Result</text></g>
  <line x1="552" y1="112" x2="576" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#cf-arrow)"/>
  <g filter="url(#cf-shadow)"><rect x="578" y="88" width="130" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="643" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Email alert</text></g>
  <line x1="708" y1="112" x2="732" y2="112" stroke="#1ed760" stroke-width="2" marker-end="url(#cf-arrow)"/>
  <g filter="url(#cf-shadow)"><rect x="734" y="88" width="120" height="48" rx="24" fill="#252525" stroke="#1ed760" stroke-width="2"/><text x="794" y="118" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial" font-size="12" font-weight="600">My history</text></g>

  <text x="502" y="168" text-anchor="middle" fill="#7c7c7c" font-family="Segoe UI, Arial" font-size="10">Compliant / non-compliant</text>
  <text x="643" y="168" text-anchor="middle" fill="#7c7c7c" font-family="Segoe UI, Arial" font-size="10">If non-compliant</text>
</svg>
