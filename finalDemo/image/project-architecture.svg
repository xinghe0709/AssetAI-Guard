<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="arch-title">
  <title id="arch-title">AssetGuard AI Project Architecture</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1ed760"/>
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c7c7c"/>
    </marker>
  </defs>

  <rect width="1120" height="640" fill="url(#bg)" rx="16"/>
  <rect width="1120" height="120" fill="url(#greenGlow)"/>

  <text x="560" y="48" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">AssetGuard AI - Project Architecture</text>
  <text x="560" y="78" text-anchor="middle" fill="#b3b3b3" font-family="Arial, sans-serif" font-size="14">CITS5206 Group 11 | GJP Engineering | Monorepo workspace</text>

  <g filter="url(#shadow)">
    <rect x="40" y="130" width="200" height="100" rx="10" fill="#1f1f1f" stroke="#4d4d4d" stroke-width="1"/>
    <text x="140" y="162" text-anchor="middle" fill="#1ed760" font-family="Arial" font-size="11" font-weight="bold">USERS</text>
    <text x="140" y="188" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Admin | Asset Manager</text>
    <text x="140" y="208" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">Contractor</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="118" width="240" height="124" rx="10" fill="#252525" stroke="#1ed760" stroke-width="2"/>
    <text x="420" y="148" text-anchor="middle" fill="#1ed760" font-family="Arial" font-size="11" font-weight="bold">FRONTEND</text>
    <text x="420" y="176" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold">assetguard-ui</text>
    <text x="420" y="200" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="12">React + Vite</text>
    <text x="420" y="222" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="12">Login, Assets, Evaluation, Dashboard</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="118" width="260" height="124" rx="10" fill="#252525" stroke="#1ed760" stroke-width="2"/>
    <text x="730" y="148" text-anchor="middle" fill="#1ed760" font-family="Arial" font-size="11" font-weight="bold">BACKEND</text>
    <text x="730" y="176" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="16" font-weight="bold">AssetGuard-AI</text>
    <text x="730" y="200" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="12">Flask REST API, Auth, Evaluation</text>
    <text x="730" y="222" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="12">Alerts, Email, Asset import</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="130" width="160" height="100" rx="10" fill="#1f1f1f" stroke="#4d4d4d" stroke-width="1"/>
    <text x="1000" y="162" text-anchor="middle" fill="#1ed760" font-family="Arial" font-size="11" font-weight="bold">DATA</text>
    <text x="1000" y="188" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="15" font-weight="bold">SQLite</text>
    <text x="1000" y="210" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="11">Assets, Limits, Logs, Users</text>
  </g>

  <line x1="240" y1="180" x2="298" y2="180" stroke="#1ed760" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="269" y="170" text-anchor="middle" fill="#7c7c7c" font-size="10" font-family="Arial">HTTPS</text>
  <line x1="540" y1="180" x2="598" y2="180" stroke="#1ed760" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="569" y="170" text-anchor="middle" fill="#7c7c7c" font-size="10" font-family="Arial">REST</text>
  <line x1="860" y1="180" x2="918" y2="180" stroke="#1ed760" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="320" width="280" height="130" rx="10" fill="#252525" stroke="#539df5" stroke-width="2"/>
    <text x="260" y="350" text-anchor="middle" fill="#539df5" font-family="Arial" font-size="11" font-weight="bold">AI PIPELINE (SEPARATE APP)</text>
    <text x="260" y="378" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="15" font-weight="bold">gjp-assetguard-extraction-tool</text>
    <text x="260" y="402" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="12">Flask, Gemini/GPT, GCP Vision OCR</text>
    <text x="260" y="424" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="12">PDF/drawings to design criteria and JSON</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="345" width="56" height="80" rx="6" fill="#1f1f1f" stroke="#4d4d4d"/>
    <rect x="52" y="358" width="32" height="40" rx="2" fill="#181818" stroke="#7c7c7c"/>
    <text x="68" y="412" text-anchor="middle" fill="#b3b3b3" font-size="9" font-family="Arial">PDF</text>
  </g>

  <line x1="96" y1="385" x2="118" y2="385" stroke="#7c7c7c" stroke-width="2" marker-end="url(#arrowMuted)"/>
  <path d="M400 385 L520 385 L520 280 L598 280" fill="none" stroke="#1ed760" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="372" text-anchor="middle" fill="#1ed760" font-family="Arial" font-size="11" font-weight="bold">JSON to uploads/</text>
  <text x="555" y="268" text-anchor="middle" fill="#1ed760" font-family="Arial" font-size="10">POST /api/v1/assets/import-json-uploads</text>

  <g filter="url(#shadow)">
    <rect x="480" y="320" width="520" height="200" rx="12" fill="#181818" stroke="#4d4d4d" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="740" y="348" text-anchor="middle" fill="#b3b3b3" font-family="Arial" font-size="11" font-weight="bold">MVP RUNTIME FLOW</text>
    <rect x="510" y="368" width="130" height="56" rx="8" fill="#1f1f1f"/>
    <text x="575" y="392" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="Arial">Select asset</text>
    <text x="575" y="410" text-anchor="middle" fill="#b3b3b3" font-size="10" font-family="Arial">+ load input</text>
    <rect x="660" y="368" width="130" height="56" rx="8" fill="#1f1f1f"/>
    <text x="725" y="392" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="Arial">Compare limits</text>
    <text x="725" y="410" text-anchor="middle" fill="#b3b3b3" font-size="10" font-family="Arial">unit conversion</text>
    <rect x="810" y="368" width="170" height="56" rx="8" fill="#1f1f1f"/>
    <text x="895" y="392" text-anchor="middle" fill="#1ed760" font-size="12" font-weight="bold" font-family="Arial">Compliant / Non-Compliant</text>
    <text x="895" y="410" text-anchor="middle" fill="#b3b3b3" font-size="10" font-family="Arial">logged, optional email</text>
    <line x1="640" y1="396" x2="658" y2="396" stroke="#7c7c7c" stroke-width="2" marker-end="url(#arrowMuted)"/>
    <line x1="790" y1="396" x2="808" y2="396" stroke="#7c7c7c" stroke-width="2" marker-end="url(#arrowMuted)"/>
    <text x="740" y="468" text-anchor="middle" fill="#7c7c7c" font-family="Arial" font-size="11">Decision-support only - not a replacement for engineering judgement</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="520" width="200" height="72" rx="10" fill="#1f1f1f" stroke="#4d4d4d"/>
    <text x="140" y="548" text-anchor="middle" fill="#1ed760" font-size="11" font-weight="bold" font-family="Arial">CLIENT</text>
    <text x="140" y="572" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" font-family="Arial">GJP Engineering</text>
  </g>

  <text x="280" y="558" fill="#7c7c7c" font-family="Arial" font-size="12">Weekly meetings, MVP scope, sample drawings and data</text>

  <rect x="880" y="520" width="200" height="72" rx="10" fill="#1f1f1f" stroke="#4d4d4d"/>
  <circle cx="908" cy="548" r="6" fill="#1ed760"/>
  <text x="924" y="552" fill="#b3b3b3" font-size="11" font-family="Arial">Core integration path</text>
  <circle cx="908" cy="572" r="6" fill="#539df5"/>
  <text x="924" y="576" fill="#b3b3b3" font-size="11" font-family="Arial">Independent AI service</text>
</svg>
